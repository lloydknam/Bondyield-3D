name: Refresh official macro data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect FRED and ECOS observations
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          ECOS_SERIES_JSON: ${{ vars.ECOS_SERIES_JSON }}
        run: python econ-dashboard/scripts/collect_official_macro.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add econ-dashboard/data/official-macro.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official macroeconomic data"
            git push
          fi
